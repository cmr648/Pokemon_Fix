name: Build Slot-6 Pokemon Automation (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Check out modified source
        uses: actions/checkout@v7

      # This mirrors Pokemon Automation's own current CI workaround.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall'
          version: '6.10.2'
          modules: 'qtmultimedia qtserialport'
          cache: true

      - name: Configure and build
        shell: pwsh
        run: |
          Set-Location SerialPrograms
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Set-Location bin

          cmake .. -DQT_MAJOR:STRING=6
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }

          cmake --build . --config RelWithDebInfo --parallel 10
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      # Pokemon Automation intentionally skips Qt deployment while running
      # under GitHub Actions. Run windeployqt ourselves so the downloaded
      # artifact can run on a normal Windows PC without a local Qt install.
      - name: Add Qt runtime files
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'SerialPrograms\bin\RelWithDebInfo'
          $exe = Join-Path $out 'SerialPrograms.exe'

          if (!(Test-Path $exe)) {
            Write-Host "Contents of output directory:"
            Get-ChildItem -Recurse $out -ErrorAction SilentlyContinue
            throw "SerialPrograms.exe was not found at: $exe"
          }

          $windeployqt = (Get-Command windeployqt.exe -ErrorAction Stop).Source

          & $windeployqt `
            --release `
            --compiler-runtime `
            --dir $out `
            $exe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - name: Verify custom build
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'SerialPrograms\bin\RelWithDebInfo'

          $required = @(
            'SerialPrograms.exe',
            'Qt6Core.dll',
            'Qt6Widgets.dll',
            'Resources',
            'Firmware'
          )

          foreach ($item in $required) {
            $path = Join-Path $out $item
            if (!(Test-Path $path)) {
              throw "Required build output is missing: $item"
            }
          }

          Write-Host "Build looks good."
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload custom Windows build
        uses: actions/upload-artifact@v7
        with:
          name: PokemonAutomation-Slot6-Windows
          path: SerialPrograms/bin/RelWithDebInfo/
          if-no-files-found: error
          retention-days: 14
